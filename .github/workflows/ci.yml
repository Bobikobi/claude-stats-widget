name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported interpreter and a current one, on both targets
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Compile
        run: python -m py_compile claude-stats-widget

      - name: Lint
        run: |
          python -m pip install --quiet ruff
          # E9 = syntax/IO errors, F = pyflakes (undefined and unused names).
          # Deliberately not a style gate: this file has a house style.
          python -m ruff check --select=E9,F --target-version=py39 claude-stats-widget

      - name: Stats collection runs on an empty profile
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, json
          from importlib.machinery import SourceFileLoader
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          loader = SourceFileLoader("csw", "claude-stats-widget")
          spec = importlib.util.spec_from_loader("csw", loader)
          m = importlib.util.module_from_spec(spec)
          loader.exec_module(m)

          # No ~/.claude here, so this also proves the widget survives having
          # nothing to read rather than only working on a populated machine.
          stats = m.collect_stats()
          assert stats["sessions"] == 0, stats
          assert stats["total_tokens"] == 0, stats
          json.dumps(stats)

          # the icon encoder must not need any image library
          png = m.clawd_png(m.icon_grid(), 4)
          assert png.startswith(b"\x89PNG\r\n\x1a\n"), png[:8]

          # our own polling must never be counted, and real projects must be
          assert m.is_poll_dir(m.POLL_PROJECT)
          assert not m.is_poll_dir("home-user-projects-claude-stats-widget")
          assert m.is_poll_dir("home-user-cache-claude-stats-widget-poll")

          assert m.parse_usage("nothing useful here") is None
          report = m.parse_usage(
              "Current session: 42% used (resets 3pm)\n"
              "Current week (all models): 7% used (resets Sunday)")
          assert report["session_pct"] == 42, report
          assert report["week_pct"] == 7, report

          tray_stats = {
              "window_5h": {"quota_pct": 42, "window_seconds": 18_000},
              "window_7d": {"quota_pct": 7, "window_seconds": 604_800},
          }
          assert m.tray_tooltip(tray_stats, "en", {}, now_ts=0) == (
              "Claude Stats\n5h: 42%\n7d: 7%")
          assert m.tray_tooltip(
              tray_stats, "en", {"tray_show_hour5": False}, now_ts=0) == (
                  "Claude Stats\n7d: 7%")
          assert m.usage_progress(tray_stats, "hour5", now_ts=0) == 42
          panel = m.panel_state(
              tray_stats, "en", {}, "clawd-1.png", now_ts=0)
          assert panel["hour5_pct"] == 42
          assert panel["week_pct"] == 7
          assert panel["show_hour5"] and panel["show_week"]
          assert panel["icon"] == "clawd-1.png"
          tray_stats["window_5h"] = {
              "quota_pct": None, "resets_at": 9_000, "window_seconds": 18_000}
          tray_stats["window_7d"] = {
              "quota_pct": None, "resets_at": 86_400, "window_seconds": 604_800}
          tooltip = m.tray_tooltip(tray_stats, "en", {}, now_ts=0)
          assert "50% (time progress, not quota use)" in tooltip, tooltip
          assert "resets in 1d 0h" in tooltip, tooltip
          assert m.usage_progress(tray_stats, "hour5", now_ts=0) == 50
          tray_png = m.clawd_png(
              m.tray_icon_grid(m.clawd_grid(), 42), 1)
          assert tray_png.startswith(b"\x89PNG\r\n\x1a\n"), tray_png[:8]
          for pct, color in ((0, "2"), (50, "3"), (100, "5")):
              grid = m.tray_icon_grid(m.clawd_grid(), pct)
              assert len(grid) == 16 and all(len(row) == 16 for row in grid)
              assert all(row[-2] == "L" for row in grid)
              assert sum(row[-1] == color for row in grid) == round(
                  16 * pct / 100)

          class Response:
              def __init__(self, content):
                  self.content = content
              def __enter__(self):
                  return self
              def __exit__(self, *args):
                  return None
              def read(self, _limit):
                  return self.content

          extension_files = {
              "extension.js": b"export default class Test {};\n",
              "metadata.json": json.dumps({
                  "uuid": "claude-stats-widget@bobikobi",
              }).encode(),
          }
          with TemporaryDirectory() as directory:
              extension_dir = (
                  Path(directory) / "gnome-shell" / "extensions"
                  / "claude-stats-widget@bobikobi")
              extension_dir.mkdir(parents=True)
              replies = [Response(extension_files[name])
                         for name in ("extension.js", "metadata.json")]
              with patch.object(m, "IS_WINDOWS", False), \
                      patch.dict("os.environ", {
                          "XDG_DATA_HOME": directory, "PATH": "/usr/bin",
                      }, clear=True), \
                      patch.object(m, "urlopen", side_effect=replies):
                  assert m.install_latest_gnome_extension()
              for name, content in extension_files.items():
                  assert (extension_dir / name).read_bytes() == content

          with TemporaryDirectory() as directory:
              target = Path(directory) / "widget"
              target.write_text("old = True\n", encoding="utf-8")
              target.chmod(0o755)
              new_source = b"APP_VERSION = (1, 0, 0)\nnew = True\n"
              with patch.object(m, "urlopen", return_value=Response(new_source)):
                  assert m.install_latest_update(target, "https://example.test/widget")
              assert target.read_bytes() == new_source
              assert target.stat().st_mode & 0o777 == 0o755
              with patch.object(m, "urlopen", return_value=Response(new_source)):
                  assert not m.install_latest_update(target, "https://example.test/widget")
              next_source = b"APP_VERSION = (1, 0, 1)\nnew = True\n"
              with patch.object(m, "urlopen", return_value=Response(next_source)):
                  assert m.install_latest_update(
                      target, "https://example.test/widget")
              older_source = b"APP_VERSION = (0, 9, 9)\nolder = True\n"
              with patch.object(m, "urlopen", return_value=Response(older_source)):
                  assert not m.install_latest_update(
                      target, "https://example.test/widget")
              bad_source = b"APP_VERSION = (1, 0, 2)\nnot python =\n"
              with patch.object(m, "urlopen", return_value=Response(bad_source)):
                  try:
                      m.install_latest_update(target, "https://example.test/widget")
                  except SyntaxError:
                      pass
                  else:
                      raise AssertionError("invalid update was accepted")
              assert target.read_bytes() == next_source
          print("ok")
          PY

      - name: Icon writes and the GUI imports
        if: runner.os == 'Windows'
        run: |
          python claude-stats-widget --write-icon
          python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Installer parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $err = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1), [ref]$null, [ref]$err) | Out-Null
          if ($err) { $err | ForEach-Object { $_.Message }; exit 1 }
          Write-Host "install.ps1 parses clean"

      - name: Installer is executable and shell-clean
        if: runner.os == 'Linux'
        run: |
          test -x install.sh || { echo "install.sh is not executable"; exit 1; }
          bash -n install.sh
          # a shell script with CRLF dies on Linux with a baffling error, and
          # a Windows checkout is enough to introduce it
          ! grep -qU $'\r' install.sh || { echo "install.sh has CRLF"; exit 1; }
          ! grep -qU $'\r' claude-stats-widget || { echo "widget has CRLF"; exit 1; }

      - name: GNOME extension parses
        if: runner.os == 'Linux'
        run: node --input-type=module --check < gnome-extension/extension.js
